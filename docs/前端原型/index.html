<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学流智学 · 题库</title>
<style>
:root{
  --bg:#1A1D24; --panel:rgba(255,255,255,.045); --panel-2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.13);
  --mint:#5AE3D0; --mint-dim:rgba(90,227,208,.12); --mint-line:rgba(90,227,208,.28);
  --text:#E7EAF0; --dim:#98A1AF; --muted:#6B7382;
  --amber:#E7C07B; --rose:#E39A9A;
  --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 85%)}
.glow{position:fixed;z-index:0;width:560px;height:560px;top:-260px;right:-140px;border-radius:50%;background:rgba(90,227,208,.05);filter:blur(120px);pointer-events:none}

.topbar{position:relative;z-index:6;height:56px;display:flex;align-items:center;gap:26px;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(26,29,36,.74);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-mark{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;border:1px solid rgba(90,227,208,.3);background:rgba(90,227,208,.08)}
.brand-name{font-size:15px;font-weight:600;letter-spacing:.5px}
.brand-sub{font-size:11.5px;color:var(--muted);padding-left:10px;border-left:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:4px}
.nav a{position:relative;padding:6px 12px;border-radius:7px;font-size:13.5px;color:var(--dim);text-decoration:none;transition:.16s}
.nav a:hover{color:var(--text);background:var(--panel)}
.nav a.active{color:var(--mint);background:var(--mint-dim)}
.nav a.active::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--mint);opacity:.7}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.search{display:flex;align-items:center;gap:8px;width:250px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.03);transition:.16s}
.search:focus-within{border-color:var(--mint-line);background:rgba(255,255,255,.05)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);font-size:13px;font-family:inherit}
.search input::placeholder{color:var(--muted)}
.streak{font-size:12px;color:var(--dim);padding:5px 10px;border-radius:7px;border:1px solid var(--line)}
.streak b{color:var(--mint);font-weight:600;padding:0 2px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;color:#0C1A18;background:rgba(90,227,208,.75);border:1px solid rgba(90,227,208,.5)}

.app{position:relative;z-index:1;display:grid;grid-template-columns:242px minmax(0,1fr);height:calc(100vh - 56px - 26px)}
.sidebar{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:rgba(255,255,255,.018)}
.proj-wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:4px}
.proj-children{flex:1;min-height:0;display:flex;flex-direction:column}
.proj-wrap.collapsed .proj-children{display:none}
.proj-row{display:flex;align-items:center;gap:7px;padding:8px 10px 4px;font-size:13px;user-select:none;cursor:pointer}
.proj-row:hover{background:var(--panel)}
.proj-row .caret{width:10px;flex:none;color:var(--muted);transition:transform .18s}
.proj-wrap.collapsed>.proj-row .caret{transform:rotate(-90deg)}
.proj-wrap.collapsed .proj-children{display:none}
.proj-badge{font-size:10.5px;color:var(--muted);padding:1px 6px;border:1px solid var(--line);border-radius:5px}
.proj-hint{display:flex;align-items:center;gap:6px;padding:2px 10px 8px;font-size:11px;color:var(--muted)}
.proj-hint svg{flex:none}
.tree{flex:1;overflow:auto;padding:2px 8px 12px;font-size:13px}
.tree::-webkit-scrollbar{width:5px}
.tree::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.node.collapsed>.row .caret{transform:rotate(-90deg)}
.node.collapsed>.children{display:none}
.children{position:relative}
.children::before{content:"";position:absolute;left:13px;top:1px;bottom:1px;width:1px;background:rgba(255,255,255,.07)}
.row{position:relative;display:flex;align-items:center;gap:7px;height:27px;padding:0 8px;border-radius:7px;color:var(--text);cursor:pointer;user-select:none;white-space:nowrap}
.row:hover{background:var(--panel)}
.row.active{background:var(--mint-dim);box-shadow:inset 0 0 0 1px rgba(90,227,208,.24)}
.row .caret{width:9px;flex:none;color:var(--muted);transition:transform .18s}
.row .caret.ghost{visibility:hidden}
.row .name{overflow:hidden;text-overflow:ellipsis}
.row .count{margin-left:auto;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .ext{color:var(--muted);font-size:12px}
.row.muted{color:var(--muted);cursor:default}
.row.muted:hover{background:none}
.ico-folder,.ico-file{flex:none;display:grid;place-items:center}
.tool-sec{flex:none;border-top:1px solid var(--line)}
.tool-row{display:flex;align-items:center;gap:8px;height:27px;padding:0 14px;font-size:12.5px;color:var(--dim);cursor:pointer;user-select:none}
.tool-row:hover{background:var(--panel);color:var(--text)}
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,rgba(90,227,208,.45),var(--mint))}

.main{overflow:auto;padding:18px 24px 44px}
.crumbs{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.crumbs span{color:rgba(255,255,255,.18)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:8px}
h1{margin:0 0 6px;font-size:20px;font-weight:600;letter-spacing:.3px}
.page-sub{font-size:12.5px;color:var(--dim)}
.page-sub b{color:var(--mint);font-weight:600}
.ghost-btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);font-size:13px;font-family:inherit;cursor:pointer;transition:.16s}
.ghost-btn:hover{color:var(--text);border-color:var(--line-2);background:var(--panel-2)}

.strip{display:flex;align-items:center;gap:18px;margin:16px 0 14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);backdrop-filter:blur(14px)}
.strip-left{flex:1;min-width:0}
.strip-title{font-size:13px;color:var(--text);margin-bottom:8px}
.strip-title em{font-style:normal;color:var(--mint)}
.strip .bar{max-width:420px}
.strip-meta{font-size:11.5px;color:var(--muted);margin-top:7px}
.strip-btn{flex:none;padding:8px 16px;border-radius:8px;border:1px solid rgba(90,227,208,.4);background:rgba(90,227,208,.1);color:var(--mint);font-size:13px;font-family:inherit;cursor:pointer;transition:.16s}
.strip-btn:hover{background:rgba(90,227,208,.18);box-shadow:0 0 18px rgba(90,227,208,.12)}

.chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--dim);font-size:12.5px;font-family:inherit;cursor:pointer;transition:.16s}
.chip:hover{color:var(--text);border-color:var(--line-2)}
.chip.active{color:var(--mint);border-color:var(--mint-line);background:var(--mint-dim)}

.cards{display:flex;flex-direction:column;gap:12px}
.card{position:relative;padding:16px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-2px);border-color:var(--mint-line);box-shadow:0 12px 30px rgba(0,0,0,.34),0 0 0 1px rgba(90,227,208,.06)}
.card-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.idx{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:8px;font-size:12px;color:var(--mint);background:var(--mint-dim);border:1px solid rgba(90,227,208,.2);font-variant-numeric:tabular-nums}
.tag{font-size:11.5px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--dim)}
.tag.lv1{color:var(--mint);border-color:rgba(90,227,208,.24);background:rgba(90,227,208,.07)}
.tag.lv2{color:var(--amber);border-color:rgba(231,192,123,.24);background:rgba(231,192,123,.07)}
.tag.lv3{color:var(--rose);border-color:rgba(227,154,154,.24);background:rgba(227,154,154,.07)}
.state{margin-left:auto;font-size:11.5px;padding:2px 8px;border-radius:6px;color:var(--muted);border:1px solid var(--line)}
.state.ok{color:var(--mint);border-color:rgba(90,227,208,.24);background:rgba(90,227,208,.07)}
.state.no{color:var(--rose);border-color:rgba(227,154,154,.24);background:rgba(227,154,154,.07)}
.card h3{margin:0 0 12px;font-size:15px;font-weight:500;line-height:1.7;color:var(--text)}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px dashed var(--line)}
.foot-actions{display:flex;align-items:center;gap:8px}
.ghost-mini{padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);font-size:12.5px;font-family:inherit;cursor:pointer;transition:.16s}
.ghost-mini:hover{color:var(--text);border-color:var(--line-2);background:var(--panel-2)}
.explain-panel{max-height:0;overflow:hidden;opacity:0;transform:translateY(-4px);transition:max-height .32s ease,opacity .32s ease,transform .32s ease}
.explain-inner{margin-top:12px;padding:12px 14px;border-radius:8px;border:1px solid rgba(90,227,208,.16);background:rgba(90,227,208,.05);font-size:12.8px;line-height:1.8;color:var(--dim)}
.explain-inner b{color:var(--mint);font-weight:600}
.meta{font-size:12px;color:var(--muted)}
.meta i{font-style:normal;color:rgba(255,255,255,.18);padding:0 6px}
.primary-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:1px solid rgba(90,227,208,.42);background:rgba(90,227,208,.11);color:var(--mint);font-size:13px;font-family:inherit;cursor:pointer;transition:.16s}
.primary-btn:hover{background:rgba(90,227,208,.2);box-shadow:0 0 18px rgba(90,227,208,.14)}
.primary-btn svg{transition:transform .16s}
.primary-btn:hover svg{transform:translateX(3px)}
.empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:var(--r)}

.statusbar{position:fixed;z-index:7;left:0;right:0;bottom:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:11.5px;color:var(--muted);background:rgba(26,29,36,.88);border-top:1px solid var(--line);backdrop-filter:blur(14px)}
.status-left{display:flex;align-items:center;gap:7px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 7px rgba(90,227,208,.55)}
.status-mid{font-variant-numeric:tabular-nums}
.status-right{display:flex;gap:16px}

.ai-ball{position:fixed;z-index:20;right:26px;bottom:44px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:1px solid rgba(90,227,208,.4);background:radial-gradient(circle at 34% 28%,rgba(90,227,208,.26),rgba(90,227,208,.07) 72%);box-shadow:0 0 0 6px rgba(90,227,208,.035),0 10px 26px rgba(0,0,0,.42);transition:transform .18s, box-shadow .18s}
.ai-ball:hover{transform:translateY(-2px);box-shadow:0 0 0 8px rgba(90,227,208,.05),0 14px 30px rgba(0,0,0,.45)}
.ai-ball::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(90,227,208,.16);animation:pulse 3.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.8}70%{transform:scale(1.16);opacity:0}100%{opacity:0}}
.ai-clip{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden}
.ai-face{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 16%;transform:scale(1.04)}
.ai-ball{animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 6px rgba(90,227,208,.03),0 10px 26px rgba(0,0,0,.42)}50%{box-shadow:0 0 0 9px rgba(90,227,208,.09),0 10px 30px rgba(90,227,208,.14)}}
.ai-ball-dot{position:absolute;right:2px;bottom:2px;width:12px;height:12px;border-radius:50%;background:var(--mint);border:2px solid #1A1D24;box-shadow:0 0 6px rgba(90,227,208,.7);animation:blink 2.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
.action-card{display:flex;align-items:center;gap:10px;align-self:flex-start;max-width:94%;padding:11px 12px;border-radius:12px;border:1px solid rgba(90,227,208,.3);background:rgba(90,227,208,.08);cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s}
.action-card:hover{transform:translateY(-2px);border-color:rgba(90,227,208,.5);box-shadow:0 10px 24px rgba(0,0,0,.35),0 0 16px rgba(90,227,208,.12)}
.ac-ico{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;border:1px solid rgba(90,227,208,.3);background:rgba(90,227,208,.1)}
.ac-title{font-size:12.8px;color:#DDFBF6;font-weight:500}
.ac-sub{font-size:11px;color:var(--muted);margin-top:3px}
.ac-go{flex:none;margin-left:auto;padding:6px 12px;border-radius:8px;border:1px solid rgba(90,227,208,.42);background:rgba(90,227,208,.14);color:var(--mint);font-size:12px;font-family:inherit;cursor:pointer}
.ac-go:hover{background:rgba(90,227,208,.24)}
.ai-head .ai-head-face{width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:50% 15%;border:1px solid rgba(90,227,208,.35);flex:none}
.ai-head .ai-name{font-weight:500}
.ai-role{font-size:11px;color:var(--muted);margin-left:-2px}

.ai-panel{position:fixed;z-index:21;right:26px;bottom:110px;width:340px;height:496px;display:flex;flex-direction:column;overflow:hidden;border-radius:14px;border:1px solid var(--mint-line);background:rgba(28,32,40,.74);backdrop-filter:blur(22px);box-shadow:0 20px 50px rgba(0,0,0,.5);opacity:0;transform:translateY(10px) scale(.98);pointer-events:none;transition:.2s ease}
.ai-panel.open{opacity:1;transform:none;pointer-events:auto}
.ai-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}
.ai-head .ai-name{font-weight:500}
.ai-head .ai-state{font-size:11px;color:var(--mint);display:inline-flex;align-items:center;gap:5px;margin-left:2px}
.ai-head .ai-state::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--mint);box-shadow:0 0 6px rgba(90,227,208,.6)}
.ai-close{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:4px}
.ai-close:hover{color:var(--text)}
.ai-body{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ai-body::-webkit-scrollbar{width:4px}
.ai-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
.msg{max-width:87%;padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.65}
.msg.bot{align-self:flex-start;background:rgba(255,255,255,.05);border:1px solid var(--line);border-top-left-radius:4px;color:var(--text)}
.msg.me{align-self:flex-end;background:rgba(90,227,208,.14);border:1px solid rgba(90,227,208,.22);border-top-right-radius:4px;color:#DDFBF6}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.quick button{padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);font-size:11.5px;font-family:inherit;cursor:pointer;transition:.14s}
.quick button:hover{color:var(--mint);border-color:var(--mint-line);background:var(--mint-dim)}
.ai-input{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.ai-input input{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font-size:12.5px;font-family:inherit;outline:none}
.ai-input input::placeholder{color:var(--muted)}
.ai-input input:focus{border-color:var(--mint-line)}
.ai-send{padding:8px 14px;border-radius:8px;border:1px solid rgba(90,227,208,.4);background:rgba(90,227,208,.12);color:var(--mint);font-size:12.5px;font-family:inherit;cursor:pointer}
.ai-send:hover{background:rgba(90,227,208,.2)}

@media (max-width:1120px){
  .search{width:170px}
  .app{grid-template-columns:216px minmax(0,1fr)}
  .brand-sub{display:none}
}
@media (max-width:900px){
  .app{grid-template-columns:196px minmax(0,1fr)}
  .nav{display:none}
  .search{display:none}
  .topbar{gap:14px;padding:0 14px}
  .main{padding:14px 16px 40px}
  .strip{padding:12px 14px}
  .strip .bar{max-width:none}
  .tree{font-size:12.5px}
}
@media (max-width:680px){
  .app{grid-template-columns:172px minmax(0,1fr)}
  .streak{display:none}
  .brand-name{font-size:14px}
  .main{padding:12px 12px 38px}
  .row{height:25px}
  .card{padding:14px}
  .card h3{font-size:14px}
}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5AE3D0" stroke-width="1.4" stroke-linejoin="round">
        <path d="M12 2.5 20 7v10l-8 4.5L4 17V7l8-4.5Z"/>
        <path d="M12 7.2 16.2 9.6v4.8L12 16.8 7.8 14.4V9.6L12 7.2Z" opacity=".55"/>
      </svg>
    </span>
    <span class="brand-name">学流智学</span>
    <span class="brand-sub">智能学习工作台</span>
  </div>
  <nav class="nav">
    <a href="#" class="active">题库</a>
    <a href="#">教材</a>
    <a href="#">学习报告</a>
    <a href="#">学习小组</a>
  </nav>
  <div class="top-right">
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B7382" stroke-width="1.6"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.6-3.6"/></svg>
      <input type="text" placeholder="搜索题目或知识点" />
    </div>
    <div class="streak">连续学习 <b>12</b> 天</div>
    <div class="avatar">李</div>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="proj-wrap" id="projWrap">
      <div class="proj-row" id="projToggle">
        <svg class="caret" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 3l3 3 3-3"/></svg>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5AE3D0" stroke-width="1.4" stroke-linejoin="round">
          <path d="M12 2.5 20 7v10l-8 4.5L4 17V7l8-4.5Z"/>
          <path d="M12 7.2 16.2 9.6v4.8L12 16.8 7.8 14.4V9.6L12 7.2Z" opacity=".5"/>
        </svg>
        <span>studyflow-ai</span>
        <span class="proj-badge">题库</span>
      </div>
      <div class="proj-children">
        <div class="proj-hint">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6B7382" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M10 9.5h4M12 9.5v5"/></svg>
          打开题库工程
        </div>
        <div class="tree" id="tree"></div>
      </div>
    </div>
    <div class="tool-sec">
      <div class="tool-row">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5 4.5h4.5v15H5zM9.5 6.5 14 5v14.5L9.5 21"/><path d="M16.5 5.8 19 6.6v12l-2.5.6"/></svg>
        外部库
      </div>
      <div class="tool-row">

<script>
const QUESTIONS = [
  { id:1, chapter:"第一章 线性表", level:"入门", levelKey:"lv1", type:"单选题",
    title:"在单链表中，若指针 p 指向某个结点，要在 p 之后插入新结点 s，正确的操作顺序是？",
    tags:["链表","指针"], time:"2 分钟", rate:"68%",
    options:["s 的后继指向 p 的后继，再让 p 的后继指向 s","先让 p 的后继指向 s，再让 s 的后继指向 p 的后继","让 s 的后继指向 p，再让 p 的后继指向 s","先让 p 的后继指向 s 的后继，再让 s 的后继指向 p"],
    answer:0,
    explain:"插入操作必须先保住 p 原来的后继：先执行「s 的后继 = p 的后继」，再执行「p 的后继 = s」。如果顺序反过来，p 原本的后继会丢失，链表从此断开。" },
  { id:2, chapter:"第一章 线性表", level:"进阶", levelKey:"lv2", type:"单选题",
    title:"元素 1、2、3、4 依次入栈，入栈过程中允许出栈，则下列哪个出栈序列不可能出现？",
    tags:["栈"], time:"3 分钟", rate:"52%",
    options:["1、2、3、4","4、3、2、1","3、1、2、4","2、3、4、1"],
    answer:2,
    explain:"当 3 出栈时，1 和 2 都已压在栈中，且 2 位于 1 之上。栈的后进先出特性决定了必须先弹出 2 才能弹出 1，所以「3、1、2、4」不可能出现。" },
  { id:3, chapter:"第二章 树与图", level:"进阶", levelKey:"lv2", type:"单选题",
    title:"一棵完全二叉树共有 1000 个结点，则它的叶子结点个数是？",
    tags:["二叉树","性质"], time:"3 分钟", rate:"47%",
    options:["500","489","512","511"],
    answer:0,
    explain:"完全二叉树中，度为 0 的结点数满足「叶子数 = 向下取整((结点总数 + 1) / 2)」。代入 1000 得 500，因此叶子结点共 500 个。" },
  { id:4, chapter:"第三章 排序与查找", level:"挑战", levelKey:"lv3", type:"单选题",
    title:"下列排序算法中，在最坏情况下时间复杂度仍为 O(n log n) 的是？",
    tags:["归并排序","复杂度"], time:"2 分钟", rate:"61%",
    options:["快速排序","归并排序","插入排序","冒泡排序"],
    answer:1,
    explain:"归并排序的拆分与合并层数固定为 log n 层，每层合并代价为 O(n)，最好、最坏、平均都是 O(n log n)。快速排序在最坏情况（如已有序且基准选择不当）会退化为 O(n²)。" },
  { id:5, chapter:"第一章 线性表", level:"入门", levelKey:"lv1", type:"单选题",
    title:"与链表相比，关于顺序表的描述正确的是？",
    tags:["顺序表","存储结构"], time:"2 分钟", rate:"73%",
    options:["支持按下标随机访问，但插入和删除平均需要移动元素","支持随机访问，且插入删除不需要移动元素","插入删除效率一定高于链表","必须预先分配固定空间，无法动态扩容"],
    answer:0,
    explain:"顺序表用连续空间存储，可按 O(1) 随机访问；但插入、删除需要移动后续元素，平均代价 O(n)。现代实现可以动态扩容，因此「无法扩容」的说法不成立。" },
  { id:6, chapter:"第一章 极限", level:"入门", levelKey:"lv1", type:"单选题",
    title:"极限 lim(x→0) sin(3x) / x 的值是？",
    tags:["极限","重要极限"], time:"2 分钟", rate:"81%",
    options:["1","3","1/3","0"],
    answer:1,
    explain:"利用第一个重要极限 lim(t→0) sin t / t = 1。把分子分母同乘 3，凑成 sin(3x)/(3x) × 3，前者趋于 1，所以整个极限等于 3。" },
  { id:7, chapter:"第一章 极限", level:"入门", levelKey:"lv1", type:"单选题",
    title:"极限 lim(x→∞) (1 + 1/x)^x 的值是？",
    tags:["极限","重要极限"], time:"2 分钟", rate:"78%",
    options:["e","1","0","无穷大"],
    answer:0,
    explain:"这是第二个重要极限，lim(x→∞) (1 + 1/x)^x = e ≈ 2.718。它的变形式 (1 + 1/n)^n 也常出现在数列极限题里，记住结构就能秒判。" }
];

const STORE_KEY = "studyflow_progress";
function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch(e){ return {}; }
}
let progress = loadProgress();
let currentChapter = "第一章 线性表";
let currentFilter = "all";

const cardsEl = document.getElementById("cards");
const crumbsEl = document.getElementById("crumbs");
const titleEl = document.getElementById("chapterTitle");
const totalEl = document.getElementById("totalCount");
const doneEl = document.getElementById("doneCount");
const accEl = document.getElementById("accRate");

function stateOf(id){
  const s = progress[id];
  if(!s) return "todo";
  return s === "correct" ? "done" : "wrong";
}

function render(){
  const list = QUESTIONS.filter(q => q.chapter === currentChapter && (currentFilter === "all" || stateOf(q.id) === currentFilter));
  const all = QUESTIONS.filter(q => q.chapter === currentChapter);
  const answered = all.filter(q => progress[q.id]);
  const correct = all.filter(q => progress[q.id] === "correct");

  totalEl.textContent = all.length;
  doneEl.textContent = answered.length;
  accEl.textContent = answered.length ? Math.round(correct.length / answered.length * 100) + "%" : "暂无";

  if(!list.length){
    cardsEl.innerHTML = '<div class="empty">该筛选条件下暂无题目，换个章节或筛选条件看看。</div>';
    return;
  }

  cardsEl.innerHTML = list.map((q, i) => {
    const st = stateOf(q.id);
    const badge = st === "done" ? '<span class="state ok">已答对</span>' : st === "wrong" ? '<span class="state no">已答错</span>' : '<span class="state">未作答</span>';
    return `
      <article class="card">
        <div class="card-top">
          <span class="idx">${String(i + 1).padStart(2, "0")}</span>
          <span class="tag ${q.levelKey}">${q.level}</span>
          <span class="tag">${q.type}</span>
          ${q.tags.map(t => `<span class="tag">${t}</span>`).join("")}
          ${badge}
        </div>
        <h3>${q.title}</h3>
        <div class="card-foot">
          <div class="meta">预计 ${q.time}<i>·</i>全站正确率 ${q.rate}</div>
          <div class="foot-actions">
            <button class="ghost-mini explain-btn" data-ex="${i}">查看解析</button>
            <button class="primary-btn" data-id="${q.id}">
              开始做题
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
        <div class="explain-panel"><div class="explain-inner"><b>解析</b> · ${q.explain}</div></div>
      </article>`;
  }).join("");

  cardsEl.querySelectorAll(".primary-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      location.href = "quiz.html?q=" + btn.dataset.id;
    });
  });

  cardsEl.querySelectorAll(".explain-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const card = btn.closest(".card");
      const panel = card.querySelector(".explain-panel");
      const open = panel.style.maxHeight && panel.style.maxHeight !== "0px";
      if(open){
        panel.style.maxHeight = "0px";
        panel.style.opacity = "0";
        btn.textContent = "查看解析";
      } else {
        panel.style.maxHeight = panel.scrollHeight + "px";
        panel.style.opacity = "1";
        btn.textContent = "收起解析";
      }
    });
  });
}

const TREE = [
  { name:"高等数学", chapters:["第一章 极限"] },
  { name:"数据结构与算法", chapters:["第一章 线性表","第二章 树与图","第三章 排序与查找"] },
  { name:"操作系统", chapters:["第一章 进程管理","第二章 内存管理"] },
  { name:"计算机网络", chapters:["第一章 传输层"] }
];

const FILENAMES = {
  1:"单链表插入结点", 2:"栈的出栈序列", 3:"完全二叉树叶子数",
  4:"最坏仍为对数阶的排序", 5:"顺序表与链表对比",
  6:"正弦比重要极限", 7:"第二重要极限"
};

const CARET = '<svg class="caret" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 3l3 3 3-3"/></svg>';
const CARET_GHOST = '<svg class="caret ghost" viewBox="0 0 10 10"></svg>';
const ICO_FOLDER = '<svg class="ico-folder" width="14" height="14" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.7l2 2.3h8.3A1.5 1.5 0 0 1 21 8.8v8.7A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-11Z" fill="rgba(231,192,123,.2)" stroke="#E7C07B" stroke-width="1.3"/></svg>';
const ICO_QFILE = '<svg class="ico-file" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6.5 3h7L18.5 8v12.5h-12V3Z" fill="rgba(90,227,208,.13)" stroke="#5AE3D0" stroke-width="1.3" stroke-linejoin="round"/><path d="M13.5 3v5h5" stroke="#5AE3D0" stroke-width="1.3"/></svg>';
const ICO_EMPTY = '<svg class="ico-file" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6.5 3h7L18.5 8v12.5h-12V3Z" stroke="#6B7382" stroke-width="1.3" stroke-linejoin="round"/><path d="M13.5 3v5h5" stroke="#6B7382" stroke-width="1.3"/></svg>';

let currentSubject = "数据结构与算法";

function subjectOf(chapter){
  const sub = TREE.find(s => s.chapters.includes(chapter));
  return sub ? sub.name : "";
}

function buildTree(){
  const treeEl = document.getElementById("tree");
  let html = "";
  TREE.forEach(sub => {
    html += `<div class="node sub" data-sub="${sub.name}">`;
    html += `<div class="row fold" style="padding-left:4px">${CARET}${ICO_FOLDER}<span class="name">${sub.name}</span></div>`;
    html += `<div class="children">`;
    sub.chapters.forEach(ch => {
      const qs = QUESTIONS.filter(q => q.chapter === ch);
      html += `<div class="node ch" data-chapter="${ch}">`;
      html += `<div class="row fold ch-row" style="padding-left:20px">${CARET}${ICO_FOLDER}<span class="name">${ch}</span><span class="count">${qs.length}</span></div>`;
      html += `<div class="children">`;
      if(qs.length){
        qs.forEach(q => {
          html += `<div class="row q-row" data-q="${q.id}" style="padding-left:36px">${CARET_GHOST}${ICO_QFILE}<span class="name">${String(q.id).padStart(2,"0")}_${FILENAMES[q.id]}</span><span class="ext">.题</span></div>`;
        });
      } else {
        html += `<div class="row muted" style="padding-left:36px">${CARET_GHOST}${ICO_EMPTY}<span class="name">本章题目整理中</span><span class="ext">.待</span></div>`;
      }
      html += `</div></div>`;
    });
    html += `</div></div>`;
  });
  treeEl.innerHTML = html;

  treeEl.querySelectorAll(".row.fold").forEach(row => {
    row.addEventListener("click", () => {
      const node = row.parentElement;
      node.classList.toggle("collapsed");
      if(node.classList.contains("ch")) selectChapter(node.dataset.chapter);
    });
  });
  treeEl.querySelectorAll(".q-row").forEach(row => {
    row.addEventListener("click", e => {
      e.stopPropagation();
      location.href = "quiz.html?q=" + row.dataset.q;
    });
  });
}

function selectChapter(name){
  currentChapter = name;
  currentSubject = subjectOf(name);
  treeEl.querySelectorAll(".ch-row").forEach(r => r.classList.remove("active"));
  const node = treeEl.querySelector(`.node.ch[data-chapter="${name}"]`);
  if(node){
    node.querySelector(".ch-row").classList.add("active");
  }
  titleEl.textContent = name + " · 章节练习";
  crumbsEl.innerHTML = `<span>题库</span><span>/</span>${currentSubject}<span>/</span>${name}`;
  render();
}

const treeEl = document.getElementById("tree");

document.getElementById("projToggle").addEventListener("click", () => {
  document.getElementById("projWrap").classList.toggle("collapsed");
});

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    currentFilter = chip.dataset.filter;
    render();
  });
});

document.getElementById("randomBtn").addEventListener("click", () => {
  const pool = QUESTIONS.filter(q => q.chapter === currentChapter);
  if(!pool.length) return;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  location.href = "quiz.html?q=" + pick.id;
});

document.getElementById("continueBtn").addEventListener("click", () => {
  const todo = QUESTIONS.find(q => !progress[q.id]);
  location.href = "quiz.html?q=" + (todo ? todo.id : QUESTIONS[0].id);
});

let seconds = 2535;
setInterval(() => {
  seconds++;
  const h = String(Math.floor(seconds / 3600)).padStart(2, "0");
  const m = String(Math.floor(seconds % 3600 / 60)).padStart(2, "0");
  const s = String(seconds % 60).padStart(2, "0");
  document.getElementById("studyTime").textContent = "本次学习 " + h + ":" + m + ":" + s;
}, 1000);

const aiBall = document.getElementById("aiBall");
const aiPanel = document.getElementById("aiPanel");
const aiBody = document.getElementById("aiBody");
const aiInput = document.getElementById("aiInput");
let greeted = false;

function addMsg(text, who){
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  aiBody.appendChild(div);
  aiBody.scrollTop = aiBody.scrollHeight;
}

function reply(text){
  const t = text || "";
  if(/焦虑|慌|紧张|做不出来|烦/.test(t)) return "别急，先深呼吸——吸气 4 秒，呼气 6 秒，做三次。你不需要一口气解决所有题，只需要往前挪一小步。试试点一下下方的微行动卡片，就两道最简单的极限题，做完回来告诉我。";
  if(t.includes("鼓励") || t.includes("加油")) return "你已经连续学习了 12 天，这本身就很难得。卡住不代表不行，只是大脑正在打补丁。休息一下再回来，我一直都在。";
  if(t.includes("计划")) return "给你一份三天复习方案：第一天专攻线性表，把链表插入删除的四种场景各手写一遍；第二天做树与图，重点练完全二叉树的性质计算；第三天回顾错题本，重做近两章的错误题目。每天控制在四十分钟内，效果比刷题量更重要。";
  if(t.includes("重点") || t.includes("总结")) return "本章的三个高频考点：一是链表插入删除时指针的先后顺序，二是栈与队列的进出规则，三是顺序表和链表的复杂度对比。考试中出现最多的是指针操作顺序，建议结合画图理解。";
  if(t.includes("这道题") || t.includes("为什么")) return "这题的关键在于「先保住旧链、再接新链」。画两个结点，把指针指向的变化逐步标出来，你就不会记反顺序了。";
  if(t.includes("提示")) return "小提示：先判断题目考查的是「结构特性」还是「复杂度」。如果是链表插入，注意指针赋值会覆盖原来的后继。";
  return "我在听。可以告诉我你现在最卡的是哪一题；想先缓缓也没关系，我们按你的节奏来。";
}

function addActionCard(){
  const div = document.createElement("div");
  div.className = "action-card";
  div.innerHTML = `
    <span class="ac-ico">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5AE3D0" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.5 1.5M16.9 17l1.5 1.5M18.4 5.6 16.9 7.1M7.1 16.9l-1.5 1.5"/><circle cx="12" cy="12" r="4.2"/></svg>
    </span>
    <span style="min-width:0">
      <div class="ac-title">去做2道简单的极限题</div>
      <div class="ac-sub">约 6 分钟 · 从最简单的开始，做完就回来</div>
    </span>
    <button class="ac-go">开始</button>`;
  div.addEventListener("click", () => { location.href = "quiz.html?q=6"; });
  aiBody.appendChild(div);
  aiBody.scrollTop = aiBody.scrollHeight;
}

aiBall.addEventListener("click", () => {
  aiPanel.classList.toggle("open");
  if(!greeted && aiPanel.classList.contains("open")){
    greeted = true;
    setTimeout(() => addMsg("我好焦虑，做不出来…", "me"), 160);
    setTimeout(() => addMsg("别急，先深呼吸——吸气 4 秒，呼气 6 秒，来三次。焦虑恰恰说明你在乎，这很正常。我们不求一口气做完，先从一个特别小的目标开始：尝试点一下下方的微行动卡片吧。", "bot"), 700);
    setTimeout(addActionCard, 1100);
  }
});
document.getElementById("aiClose").addEventListener("click", () => aiPanel.classList.remove("open"));

function send(text){
  const value = (text || aiInput.value).trim();
  if(!value) return;
  addMsg(value, "me");
  aiInput.value = "";
  setTimeout(() => {
    addMsg(reply(value), "bot");
    if(/焦虑|慌|做不出来|烦/.test(value)) setTimeout(addActionCard, 300);
  }, 420);
}
document.getElementById("aiSend").addEventListener("click", () => send());
aiInput.addEventListener("keydown", e => { if(e.key === "Enter") send(); });
document.querySelectorAll("#aiQuick button").forEach(b => b.addEventListener("click", () => send(b.dataset.q)));

buildTree();
selectChapter("第一章 线性表");
</script>
</body>
</html>
